<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agència FE CCOO PV - Conflicte Educatiu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <img src="imatge.png" alt="Logo CCOO PV" class="header-logo">
      <div>
        <h2>Asistent FE CCOO PV</h2>
        <p>Conflicte Educatiu Valencià</p>
      </div>
    </header>
    
    <div id="chat-messages" class="chat-messages">
      <div class="message system-message">
        Hola! Soc l'agent informatiu de la FE CCOO PV. En què et puc ajudar respecte al conflicte educatiu, les negociacions o les pròximes accions?
      </div>
    </div>

    <form id="chat-form" class="chat-input-area">
      <input type="text" id="user-input" placeholder="Escriu la teua consulta ací..." required autocomplete="off">
      <button type="submit" id="send-btn">Enviar</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
